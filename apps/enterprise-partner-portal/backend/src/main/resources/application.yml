server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: enterprise-partner-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partner_portal}
    username: ${DB_USERNAME:partner_portal}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://login.uniti.example/realms/partners}
          audiences: ${OIDC_AUDIENCE:enterprise-partner-portal}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

partner-portal:
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}
    partner-claim: ${JWT_PARTNER_CLAIM:partner_id}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pricing:
    default-currency: GBP
    quote-validity-days: 30
    max-discount-percent: 40
  deals:
    protection-days: 90
    extension-days: 30
    max-extensions: 1
    name-similarity-threshold: 0.85
  commissions:
    clawback-window-days: 90
    deal-registration-uplift-bps: 200
    new-logo-bonus-minor: 25000
  mdf:
    claim-window-days: 60
    co-op-share-percent: 50
  cases:
    first-response-hours:
      P1: 1
      P2: 4
      P3: 8
      P4: 24
    resolution-hours:
      P1: 8
      P2: 24
      P3: 72
      P4: 120
