openapi: 3.0.3
info:
  title: Uniti shared API components
  version: 1.0.0
  description: >
    Components shared by every Uniti self-care API: RFC 7807 problem details,
    the `{ items, page, pageSize, total }` pagination envelope, money in integer
    minor units, correlation and idempotency headers. Referenced from the
    per-service specs; this document declares no paths of its own.
paths: {}
components:
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 error body, served as `application/problem+json`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://errors.uniti.com/problems/business-rule
        title:
          type: string
          example: Order cannot be cancelled
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 409
        detail:
          type: string
          example: Orders in PROVISIONING can no longer be cancelled online.
        instance:
          type: string
          format: uri-reference
          example: /api/v1/orders/GK-20261111-7HQ2XK/cancel
        code:
          type: string
          description: Stable machine-readable error code for client branching.
          example: ORDER_NOT_CANCELLABLE
        correlationId:
          type: string
          format: uuid
      additionalProperties: true

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: contact.email
                  message:
                    type: string
                    example: must be a valid email address

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0

    Money:
      type: object
      description: Monetary amount. Never a floating-point number.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Amount in the currency's minor unit (cents/pence).
          example: 6999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD

    AccountId:
      type: string
      pattern: '^ACC-\d{8}$'
      example: ACC-00412398

    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC instant.
      example: '2026-11-11T09:30:00Z'

    PostalAddress:
      type: object
      required: [line1, city, postalCode]
      properties:
        line1:
          type: string
          minLength: 3
          maxLength: 120
        line2:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          pattern: '^[A-Z]{2}$'
        postalCode:
          type: string
          maxLength: 10

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    CorrelationId:
      name: X-Correlation-Id
      in: header
      description: Propagated end to end; generated by the gateway when absent.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated key. A replay with the same key and body returns the
        original response; the same key with a different body returns 422.
      schema:
        type: string
        minLength: 16
        maxLength: 64
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountId'

  headers:
    X-Correlation-Id:
      description: Echo of the request correlation id.
      schema:
        type: string
        format: uuid
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Malformed request or failed input validation.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Missing, expired or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller's role or account scope does not permit this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Request conflicts with the current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Well-formed request rejected by a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServerError:
      description: Unexpected failure; quote the correlation id to support.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
